function rd(){const i=S.sel,all=PPL.map((p,k)=>k);
const isExtra=i>=D.people.length;
let h='<div class="card"><div class="sel"><button class="btn" id="pv">‹</button><select id="ps">'+GS.map(g=>`<optgroup label="${GN[g]}">`+S.order[g].concat(all.filter(k=>PPL[k].g===g&&!S.order[g].includes(k))).map(k=>`<option value="${k}" ${k==i?'selected':''}>${S.names[k]||'—'}${S.arch[k]?' (архив)':''}</option>`).join('')+'</optgroup>').join('')+`</select><button class="btn" id="nx">›</button></div><div class="sel" style="padding-top:0"><input type="text" id="nm" style="flex:1" value="${(S.names[i]||'').replace(/"/g,'&quot;')}" placeholder="Ф.И.О."><button class="btn d" id="arch">${S.arch[i]?'Восстановить':'В архив'}</button>${isExtra?'<button class="btn d" id="del">Удалить</button>':''}</div><div class="sel" style="padding-top:0"><select id="ng">${GS.map(g=>`<option value="${g}">${GN[g]}</option>`).join('')}</select><button class="btn p" id="ap">+ Новый сотрудник</button></div>`;
const r=ranks(PPL[i].g)[i];h+=`<div class="sum"><span>Должн.: <b>${PPL[i].g}</b></span><span>Ср. коэф.: <b>${f3(avg(i))}</b></span><span>Очередь: <b>${r==null?'Нет Данных':r}</b></span>${S.arch[i]?'<span class="arn">В архиве — скрыт из очереди и графика</span>':''}${isExtra?'<span class="arn">Добавлен вручную — можно удалить</span>':''}</div>`;
h+=`<div class="sel" style="padding-top:0"><label style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;font-size:14px"><input type="checkbox" id="prio" ${S.prio[i]?'checked':''}><span>Льгота — приоритет в очереди для записи</span></label></div></div>`;
h+='<div class="card"><h2>Годы учёта (последние 3 года)</h2><div class="sel" style="padding-top:0">'+S.years.map((y,k)=>`<input type="number" inputmode="numeric" data-yr="${k}" value="${y}" style="flex:1;text-align:center">`).join('')+'</div></div>';
S.years.forEach((y,yi)=>{h+=`<div class="card"><h2><span>${y} · год. коэф.: ${fy(yr(i,yi))}</span><button class="btn d" data-y="${yi}">Очистить ${y}</button></h2><div class="mos">`;
for(let m=0;m<12;m++){h+=`<div class="mo"><b>${MN[m]}</b><div class="wk">`;for(let k=0;k<4;k++){const c=m*4+k,v=S.marks[i][yi][c];h+=`<button class="${has(v)?'on':''}" data-y="${yi}" data-k="${c}">${has(v)?v:S.w[c]}</button>`}h+='</div></div>'}h+='</div></div>'});
h+=`<div class="card"><h2><span>Коэффициенты по неделям (кф/год)</span><span style="display:flex;gap:6px"><button class="btn" id="resetW" style="font-size:12px;padding:6px 10px">↺ Сброс</button><button class="btn ${S.lockW?'p':''}" id="lockW" style="font-size:12px;padding:6px 10px">${S.lockW?'🔒 Заблокировано':'🔓 Разблокировать'}</button></span></h2><div class="ws">`;
for(let m=0;m<12;m++){h+=`<div><span>${MN[m]}</span>`;for(let k=0;k<4;k++)h+=`<input type="number" step="0.01" inputmode="decimal" data-w="${m*4+k}" value="${S.w[m*4+k]}" ${S.lockW?'disabled':''}>`;h+='</div>'}
h+='</div></div>';
$('#d').innerHTML=h;const go=d=>{const g=PPL[i].g,l=S.order[g];let k=l.indexOf(i),j=k;do{j=(j+d+l.length)%l.length}while(S.arch[l[j]]&&j!==k);S.sel=l[j];render()};
$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);$('#ps').onchange=e=>{S.sel=+e.target.value;render()};$('#nm').onchange=e=>{S.names[i]=e.target.value.trim();save()};
$('#arch').onclick=()=>{if(S.arch[i])setArch(i,false);else ask('Перевести сотрудника в архив? Он будет скрыт из очереди и графика, данные сохранятся.',()=>setArch(i,true))};
$('#ap').onclick=()=>addPerson($('#ng').value);
if(isExtra){const db=$('#del');if(db)db.onclick=()=>delPerson(i)}
$('#prio').onchange=e=>{S.prio[i]=e.target.checked;save();render();toast(e.target.checked?'Приоритет установлен':'Приоритет снят')};
$('#lockW').onclick=()=>{S.lockW=!S.lockW;save();render();toast(S.lockW?'Редактирование коэффициентов заблокировано':'Редактирование коэффициентов разблокировано')};
$('#resetW').onclick=()=>ask('Сбросить коэффициенты к исходным значениям из файла?',()=>{S.w=D.weights.slice();save();render();toast('Коэффициенты сброшены к исходным')});
$('#d').querySelectorAll('.wk button').forEach(b=>b.onclick=()=>{const m=S.marks[i][+b.dataset.y],c=+b.dataset.k;m[c]=has(m[c])?null:1;save();render()});
$('#d').querySelectorAll('h2 [data-y]').forEach(b=>b.onclick=()=>clearYear(+b.dataset.y));
$('#d').querySelectorAll('[data-yr]').forEach(e=>e.onchange=()=>{const v=parseInt(e.value,10);if(v>1900&&v<2200){S.years[+e.dataset.yr]=v;save();render()}else{e.value=S.years[+e.dataset.yr]}});
$('#d').querySelectorAll('[data-w]').forEach(e=>e.onchange=()=>{const v=parseFloat(String(e.value).replace(',','.'));if(!isNaN(v)){S.w[+e.dataset.w]=v;save();render()}})}
function rs(){let h='<div class="card"><h2>Отпуска персонала СК-2 на '+S.years[S.years.length-1]+' год (предварительно)</h2></div>';
SG.forEach(([g,t,cap])=>{h+=`<div class="card"><h2>${t}<button class="btn" data-a="${g}">+ строка</button></h2><div class="sc"><table><tr><th rowspan="2">Сотрудник</th>`+MN.map(m=>`<th colspan="4" class="mt">${m}</th>`).join('')+'</tr><tr>'+Array.from({length:48},(_,c)=>`<th class="${c%4?'':'mt'}">${c%4+1}</th>`).join('')+'</tr>';
const totals=Array(48).fill(0);
S.sc[g].forEach((row,ri)=>{row.w.forEach((x,c)=>{if(x)totals[c]++});h+=`<tr><td class="n"><select data-g="${g}" data-r="${ri}"><option value="">—</option>`+PPL.map((p,k)=>p.g===g&&!S.arch[k]?`<option value="${k}" ${row.p==k&&row.p!==''?'selected':''}>${S.names[k]||'—'}${S.prio[k]?' ⭐':''}</option>`:'').join('')+`</select><button class="rm no" data-rm-g="${g}" data-rm-r="${ri}">✕</button></td>`+row.w.map((x,c)=>`<td class="c${x?' on':''}${c%4?'':' mt'}" data-g="${g}" data-r="${ri}" data-c="${c}"></td>`).join('')+'</tr>'});
h+=`<tr class="tot"><td class="n">Итого (лимит ${cap})</td>`+totals.map((v,c)=>`<td class="${c%4?'':'mt'}${v>cap?' over':''}">${v||''}</td>`).join('')+'</tr>';
h+='</table></div></div>'});
$('#s').innerHTML=h;
$('#s').querySelectorAll('td.c').forEach(e=>e.onclick=()=>{const r=S.sc[e.dataset.g][+e.dataset.r];r.w[+e.dataset.c]=r.w[+e.dataset.c]?0:1;e.classList.toggle('on');save();render()});
$('#s').querySelectorAll('select').forEach(e=>e.onchange=()=>{S.sc[e.dataset.g][+e.dataset.r].p=e.value;save()});
$('#s').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{S.sc[b.dataset.a].push({p:'',w:Array(48).fill(0)});save();render()});
$('#s').querySelectorAll('[data-rm-g]').forEach(b=>b.onclick=()=>ask('Удалить эту строку из графика?',()=>{S.sc[b.dataset.rmG].splice(+b.dataset.rmR,1);save();render()}))}
function render(){autoSort();document.querySelectorAll('.pn').forEach(e=>e.classList.toggle('a',e.id===S.tab));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('a',b.dataset.t===S.tab));({q:rq,d:rd,s:rs})[S.tab]();save()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render();scrollTo(0,0)});
document.getElementById('thm').onclick=cycleTheme;
render();
</script></body></html>
